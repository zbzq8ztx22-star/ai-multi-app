name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-secret-key' }}
      OPENEXECUTIVE_API_URL: http://openexec.test
      OPENEXECUTIVE_API_KEY: test-key
      FLASK_DEBUG: '0'
      CORS_ORIGINS: '*'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-dev.txt

      - name: Run pytest with coverage
        run: python -m pytest server/tests -q --cov=server --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  python-quality:
    name: Python lint and security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      # -x ./tests excludes tests; -ll keeps only medium+ severity findings.
      # .bandit skips B608 (dynamic SQL uses internal constants + placeholders).
      - name: Bandit
        run: bandit -r . -x ./tests -ll -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned to the v3.97.9 release commit — never a mutable branch.
      # No base/head inputs: the action derives the range per event —
      # push: event.before -> event.after (zero-SHA before -> full history),
      # pull_request: PR base.sha -> head.sha, dispatch/schedule: whole repo.
      # Passing fixed inputs made push-to-main resolve BASE == HEAD.
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85
        with:
          path: ./
          extra_args: --only-verified
